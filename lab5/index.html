<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Лабораторна робота №5, варіант 2: блок header#logos_container з головної сторінки Львівської політехніки.">
  <title>Лабораторна робота №5 — header#logos_container</title>

  <!-- Шрифт, який використовує lpnu.ua -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Roboto:400,700&amp;subset=cyrillic,cyrillic-ext">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!--
    Варіант 2: header#logos_container
    Розмітку скопійовано з https://lpnu.ua/ (панель Elements).
    Посилання на зображення замінено на локальні файли з папки images/.
  -->
  <header id="logos_container" role="link" aria-label="Featured University Units">
    <div class="container">
      <div class="region region-logos">
        <section
          class="block block-block-content block-block-content4b69e4b0-1cdd-4618-8e39-8fb21a579cde clearfix"
          id="block-selectedunits">
          <div class="field field--name-body field--type-text-with-summary field--label-hidden field--item">
            <div class="row">
              <div class="col-xs-4">
                <a href="http://tsus.lpnu.ua/">
                  <img alt="Логотип Tech Startup School" class="img-responsive"
                    src="images/LPNU_logo_tech-startup-school.png" typeof="foaf:Image">
                </a>
              </div>
              <div class="col-xs-4">
                <a href="https://techbs.lpnu.ua/">
                  <img alt="Логотип Tech Business School" class="img-responsive"
                    src="images/LPNU_logo_tech-business-school.png" typeof="foaf:Image">
                </a>
              </div>
              <div class="col-xs-4">
                <a href="http://tsus.lpnu.ua/sid">
                  <img alt="Логотип наукового парку SID City" class="img-responsive"
                    src="images/LPNU_logo_SID-city-scientific-park.png" typeof="foaf:Image">
                </a>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </header>

</body>

</html>
